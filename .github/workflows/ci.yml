name: CI
on:
  - push
#   - pull_request

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  test:
    env: 
      GKS_ENCODING: "utf8"
      GKSwstype: "nul"
    name: ${{ matrix.test_set }} - ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        test_set: ["basic", "estimation"]
        version: ['1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64, arm64]
        exclude:
          - arch: arm64
            os: ubuntu-latest
          - arch: arm64
            os: windows-latest
          - arch: x64
            os: macos-latest
        include:
          - os: ubuntu-latest
            prefix: xvfb-run
          # - version: '1'
          #   os: macos-latest
          #   arch: x64
          #   test_set: "solver0"
          # - version: '1'
          #   os: macos-latest
          #   arch: x64
          #   test_set: "solver1"
          # - version: '1'
          #   os: macos-latest
          #   arch: x64
          #   test_set: "solver2"
          # - version: '1'
          #   os: macos-latest
          #   arch: x64
          #   test_set: "solver3"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "higher_order_1"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "higher_order_2"
          - version: '1'
            os: windows-latest
            arch: x64
            test_set: "higher_order_3"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "plots_1"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "plots_2"
          - version: '1'
            os: windows-latest
            arch: x64
            test_set: "plots_3"
          - version: '1'
            os: macOS-latest
            arch: arm64
            test_set: "plots_4"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "plots_5"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "estimate_sw07"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "1st_order_inversion_estimation"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "2nd_order_estimation"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "pruned_2nd_order_estimation"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "3rd_order_estimation"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "pruned_3rd_order_estimation"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "estimation_pigeons"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "1st_order_inversion_estimation_pigeons"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "2nd_order_estimation_pigeons"
          - version: '1'
            os: macOS-latest
            arch: x64
            test_set: "pruned_2nd_order_estimation_pigeons"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "3rd_order_estimation_pigeons"
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "pruned_3rd_order_estimation_pigeons"
          - version: 'min'
            os: ubuntu-latest
            arch: x64
            test_set: "basic"
          - version: 'lts'
            os: ubuntu-latest
            arch: x64
            test_set: "basic"
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
            test_set: "basic"
            allow_failure: true
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
            test_set: "jet"
            allow_failure: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_set: "jet"
          - version: 'lts'
            os: macOS-latest
            arch: x64
            test_set: "jet"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Remove Pigeons from non-pigeons runs
        if: contains(matrix.test_set, 'pigeons') == false
        shell: bash
        run: |
          sed -i.bak \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"Pigeons"//g' \
            -e '/^\[targets\]/,$ s/"Pigeons",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^Pigeons[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^Pigeons[[:space:]]*=.*$//g' \
            Project.toml
          rm -f Project.toml.bak

      - name: Remove JET from non-jet runs
        if: matrix.test_set != 'jet'
        shell: bash
        run: |
          # `JET` is only needed for the dedicated `jet` rows. Keeping it in the
          # shared test target adds resolver constraints to unrelated jobs.
          sed -i.bak \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"JET"//g' \
            -e '/^\[targets\]/,$ s/"JET",[[:space:]]*//g' \
            Project.toml
          rm -f Project.toml.bak

      - name: Remove Mooncake and DifferentiationInterface for Pigeons test sets
        if: contains(matrix.test_set, 'pigeons')
        shell: bash
        run: |
          # `Pkg.test` re-resolves the full shared test target. The pigeons rows need
          # to remove Mooncake and DifferentiationInterface.
          # JSON is patched to "0.21" so that CondaPkg 0.2.34+ (which requires JSON 1.x)
          # is excluded, forcing CondaPkg 0.2.33 (JSON3-based, no JSON dep) and
          # satisfying Pigeons' JSON = "0.21" requirement.
          sed -i.bak \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"Mooncake"//g' \
            -e '/^\[targets\]/,$ s/"Mooncake",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^Mooncake[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^Mooncake[[:space:]]*=.*$//g' \
            -e '/^\[compat\]/,/^\[/ s/^DifferentiationInterface[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^DifferentiationInterface[[:space:]]*=.*$//g' \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"DifferentiationInterface"//g' \
            -e '/^\[targets\]/,$ s/"DifferentiationInterface",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^JSON[[:space:]]*=.*$/JSON = "0.21"/' \
            Project.toml
          rm -f Project.toml.bak

      - name: Remove Turing and estimation packages for old Julia versions
        if: matrix.version == 'min' || matrix.version == 'lts'
        shell: bash
        run: |
          # On Julia 1.10 (min/lts), LinearSolve 3.63+ requires RecursiveArrayTools
          # which requires Zygote 0.7+, but Turing 0.37-0.38 (max on Julia 1.10) pulls
          # in AdvancedVI which only supports Zygote <=0.6.77. This conflict is
          # irreconcilable, so Turing and estimation-only packages are removed from
          # the test environment for the basic test set that runs on old Julia.
          sed -i.bak \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"Turing"//g' \
            -e '/^\[targets\]/,$ s/"Turing",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^Turing[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^Turing[[:space:]]*=.*$//g' \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"MCMCChains"//g' \
            -e '/^\[targets\]/,$ s/"MCMCChains",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^MCMCChains[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^MCMCChains[[:space:]]*=.*$//g' \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"DynamicPPL"//g' \
            -e '/^\[targets\]/,$ s/"DynamicPPL",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^DynamicPPL[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^DynamicPPL[[:space:]]*=.*$//g' \
            -e '/^\[targets\]/,$ s/,[[:space:]]*"LineSearches"//g' \
            -e '/^\[targets\]/,$ s/"LineSearches",[[:space:]]*//g' \
            -e '/^\[compat\]/,/^\[/ s/^LineSearches[[:space:]]*=.*$//g' \
            -e '/^\[extras\]/,/^\[/ s/^LineSearches[[:space:]]*=.*$//g' \
            Project.toml
          rm -f Project.toml.bak

      - name: Set Custom Test Environment Variable (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "TEST_SET=${{ matrix.test_set }}" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Set Custom Test Environment Variable (non-Windows)
        if: matrix.os != 'windows-latest'
        run: echo "TEST_SET=${{ matrix.test_set }}" >> $GITHUB_ENV
      # - name: Set JULIA_NUM_THREADS for estimation tests
      #   if: (matrix.version == '1' && (matrix.test_set == 'estimation' || matrix.test_set == 'estimate_sw07' || matrix.test_set == '1st_order_inversion_estimation' || matrix.test_set == 'estimation_pigeons' || matrix.test_set == '1st_order_inversion_estimation_pigeons'))
      #   run: echo "JULIA_NUM_THREADS=auto" >> $GITHUB_ENV
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: ${{ matrix.prefix }}  # for `xvfb-run`
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: lcov.info
